<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecionar imagens</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 700px; margin: 0; font-family: Arial, sans-serif; background: #f3f5f7; color: #1f2937; }
    header { position: sticky; top: 0; z-index: 10; background: white; padding: 14px; border-bottom: 1px solid #dfe3e8; }
    h1 { margin: 0 0 10px; font-size: 18px; }
    .toolbar { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    button { border: 0; border-radius: 7px; padding: 9px 11px; cursor: pointer; background: #1f2937; color: white; font-weight: 600; }
    button.primary { background: #166534; }
    button.secondary { background: #64748b; }
    button.light { background: #e2e8f0; color: #1f2937; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { margin-top: 9px; font-size: 12px; color: #475569; min-height: 16px; }
    .filters { display: grid; grid-template-columns: 1fr 150px 170px; gap: 8px; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 7px; background: white; }
    #list { max-height: 610px; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .card { position: relative; background: white; border: 2px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card.selected { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.12); }
    .preview-wrap { height: 145px; display: flex; align-items: center; justify-content: center; background: #e9edf2; position: relative; }
    .preview { max-width: 100%; max-height: 145px; object-fit: contain; }
    .check { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; z-index: 2; }
    .badge { position: absolute; right: 8px; top: 8px; padding: 4px 6px; border-radius: 999px; font-size: 10px; font-weight: 700; background: #166534; color: white; z-index: 2; }
    .info { padding: 8px; }
    .dimensions { font-size: 12px; font-weight: 700; color: #334155; }
    .source { margin-top: 3px; font-size: 11px; color: #64748b; }
    .candidate { margin-top: 5px; font-size: 10px; color: #166534; font-weight: 700; }
    .url { margin-top: 4px; font-size: 10px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { grid-column: 1 / -1; padding: 35px 15px; text-align: center; color: #64748b; background: white; border-radius: 10px; }
    .footer { position: sticky; bottom: 0; background: white; border-top: 1px solid #dfe3e8; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .footer-actions { display: flex; gap: 8px; }
    #selectionCount { font-size: 12px; color: #475569; }
  </style>
</head>
<body>
  <header>
    <h1>Imagens encontradas na página</h1>
    <div class="toolbar">
      <button id="scan">Analisar página</button>
      <button id="selectAll" class="secondary">Selecionar visíveis</button>
      <button id="clear" class="light">Limpar seleção</button>
    </div>
    <div class="filters">
      <input id="search" type="search" placeholder="Filtrar por URL ou origem">
      <select id="sizeFilter">
        <option value="0">Todos os tamanhos</option>
        <option value="200">Acima de 200 px</option>
        <option value="500">Acima de 500 px</option>
        <option value="1000">Acima de 1000 px</option>
        <option value="1600">Acima de 1600 px</option>
      </select>
      <select id="qualityMode">
        <option value="best">Preferir melhor versão</option>
        <option value="shown">Usar versão exibida</option>
      </select>
    </div>
    <div id="status" class="status">Clique em Analisar página.</div>
  </header>
  <main id="list"><div class="empty">Nenhuma análise realizada ainda.</div></main>
  <div class="footer">
    <div id="selectionCount">0 selecionada(s)</div>
    <div class="footer-actions">
      <button id="download" disabled>Baixar selecionadas</button>
      <button id="downloadAll" class="primary" disabled>Baixar todas</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
